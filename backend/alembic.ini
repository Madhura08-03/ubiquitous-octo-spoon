[alembic]
script_location = migrations
source_paths = ./app
version_locations = %(script_location)s/versions
version_path_separator = os
prepend_sys_path = .

[loggers]
keys = root,salchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =


logger_salchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[formatter_generic]
format = %(levelname)-5.5s [%(names]%s %(message)s
datefmt = %H:%M:%S

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic
